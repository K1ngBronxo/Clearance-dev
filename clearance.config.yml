# Clearance's own declared intent.
#
# `make dogfood` runs `clearance check .` against this repository, and the
# doctrine behind it is that the check "must pass, and it must pass honestly".
# This file is what makes that possible: without it the scan stops at
# E-CFG-001, because a tool whose whole thesis is that a verdict requires a
# declared intent cannot verdict on itself without one.
#
# The values below are claims about the product, not about the corpus, and each
# one is the answer to a question the engine actually asks.
schema_version: 1

project:
  name: clearance
  description: >
    A licence, model-weights and platform-terms scanner that returns a verdict.
    FSL-1.1-ALv2 — source-available, not open source (see LICENSE) — with a
    CC-BY-4.0 corpus (see corpus/SCHEMA.md).

use:
  # Clearance has a hosted tier in the plan, so the project is commercial. This
  # is the honest answer even though the CLI itself is free: the question the
  # engine asks is "does this earn revenue", not "is this particular artefact
  # sold".
  commercial: true

  # FSL-1.1-ALv2: source-available, not open source. Stated rather than
  # inferred, because the engine never reads the project's own licence file to
  # answer it — that would be the scanner deciding a fact the user is supposed
  # to declare.
  licence_model: source-available

  # The corpus is edited, but no vendored third-party code is. `modified` is
  # about the dependencies, and declaring it true would make AGPL's §13
  # obligation fire on any network-exposed AGPL dependency for a reason that does
  # not apply.
  modified: false

  # The CLI opens no socket during a scan and the plan's hosted tier is not
  # built. When it is, this becomes true and the AGPL/SSPL network clauses start
  # applying to the service — which is exactly the change the field exists to
  # make visible.
  network_exposed: false

  # Release binaries and source are published, so this is true. It is the flag
  # that turns FSL's redistribution terms on — whoever passes this work on must
  # include the licence and must leave the notices intact — which is why the
  # repository carries a LICENSE and a NOTICE rather than merely naming the
  # licence in prose.
  distributed: true

  saas: false

policy:
  ignore:
    - path: fixtures/**
      reason: >
        The fixtures are test data, not dependencies of this product. Every one
        of them is a deliberately non-compliant project — that is what makes it
        a fixture — so scanning them as Clearance's own dependencies would
        report a GPL blocker against the repository whose job is to detect GPL
        blockers. The ignore is scoped to the directory and the reason is
        recorded here rather than left to a comment, because E-SCAN-020 refuses
        an unexplained ignore: a blocker hidden without a stated reason is
        indistinguishable from a blocker hidden.

    - path: .scratch/**
      reason: >
        .scratch/ is gitignored developer scratch space (see .gitignore) and is
        never part of the product. It is ignored because investigations leave
        copies of the tree and of individual fixtures in it, and those copies sit
        OUTSIDE the fixtures/** scope above — so without this entry a probe left
        in .scratch/ is scanned as a real dependency and dogfood reports
        DO NOT SHIP against test data. That is a false blocker on the product's
        own tree, produced by an untracked directory, which is worse than a
        narrow and stated hole: it makes the verdict depend on what a developer
        happened to leave lying around.

        This was not hypothetical. A simulated published tree under
        .scratch/dist-sim, built to verify that this repository's guards pass
        without the maintainer-only directories, turned `clearance check .` from
        0 blockers into 4 and from exit 0 into exit 4 — every one of the four
        from a copy of fixtures/ inside the scratch directory. Nothing about the
        product had changed.

        A wide ignore draws a notice, and it should: while a large scratch tree
        is present the scan reports E-SCAN-020, "Ignore rule '.scratch/**'
        excluded 53% of files. This may be hiding dependencies." That is the
        engine doing its job — a rule hiding half the tree deserves a second
        look — and this paragraph is the answer it is asking for. The notice is
        a degradation, not a blocker, so the target still exits 0.
