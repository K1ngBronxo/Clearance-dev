code: GB
name: United Kingdom
notes: >
  Post-Brexit the UK keeps a database right and its own data-protection regime.
  Both can apply to a product irrespective of the licence of the software it
  ships.
gates:
  - id: gb.database-right
    summary: >
      The UK retains a database right separate from copyright. Extracting or
      re-utilising a substantial part of a protected database can infringe it
      even where the software licence allows the extraction.
    severity: NOTE
    citation:
      url: https://www.legislation.gov.uk/uksi/1997/3032/contents
      section: "Regulation 13"
      retrieved_at: "2026-09-18"
    confidence: MEDIUM
  - id: gb.uk-gdpr
    summary: >
      The UK GDPR and the Data Protection Act 2018 govern personal data in any
      dataset or telemetry a product ships. This is a processing question, not a
      licensing one, and the software licence is silent on it.
    severity: NOTE
    citation:
      url: https://www.legislation.gov.uk/ukpga/2018/12/contents
      section: "Part 2"
      retrieved_at: "2026-09-18"
    confidence: MEDIUM
