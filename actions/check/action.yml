name: 'Clearance'
description: >-
  Download a checksum-verified Clearance release binary and run it against a
  project. The Action contains no judgement of its own: it downloads, verifies,
  runs, and reports the exit code. All decisions live in the binary, so the
  Action can never drift from the CLI.

author: 'K1NGBRONXO'

branding:
  icon: 'check-circle'
  color: 'green'

# ---------------------------------------------------------------------------
# The Action is deliberately thin: it contains no logic of its own. It:
#   1. resolves the release for the requested version,
#   2. downloads the platform archive and verifies its SHA-256 against the
#      release's checksums.txt BEFORE extracting or running anything,
#   3. runs `clearance check`, captures the exit code, and exposes it.
# A checksum that does not verify aborts the step. There is no "continue
# anyway" path.
# ---------------------------------------------------------------------------

inputs:
  version:
    description: >-
      The Clearance release to download: a version such as 0.1.0-rc.2 or v0.1.0-rc.2, or
      "latest". The binary is checksum-verified against the release's
      checksums.txt regardless of which is chosen.
    required: false
    default: 'latest'

  path:
    description: 'The project directory to scan, relative to the workspace root.'
    required: false
    default: '.'

  strict:
    description: >-
      When "true", pass --strict to the binary, so an UNDETERMINED verdict
      exits 5 and fails the job. When "false" (the default), UNDETERMINED
      exits 0 and the job passes with a warning in the log.
    required: false
    default: 'false'

  args:
    description: >-
      Additional arguments passed to `clearance check`, as a single string,
      for example: --fail-on CONDITION --allow-medium-blockers. These are
      appended after the Action's own flags. See docs/ci.md for the flag list.
    required: false
    default: ''

  sarif:
    description: >-
      When "true", also write a SARIF 2.1.0 file for GitHub code scanning, and
      expose its path as the "sarif-file" output. The file is produced by the
      binary itself (--format sarif), so the findings in the Security tab are
      the binary's findings, not the Action's reading of them. Uploading it is
      the caller's step: it needs `security-events: write`, which this Action
      does not request. See docs/ci.md, "Code scanning".
    required: false
    default: 'false'

  sarif-file:
    description: >-
      Path of the SARIF file, relative to the workspace root. Only written when
      "sarif" is "true". A relative path is used because GitHub's upload action
      resolves it against the workspace, and because an absolute path would put
      a machine-specific directory into a file meant to be read centrally.
    required: false
    default: 'clearance.sarif'

outputs:
  verdict:
    description: >-
      The verdict class from the machine-readable output: SHIP,
      SHIP_CONDITIONAL, DO_NOT_SHIP, or UNDETERMINED. Empty if the run failed
      before a verdict was produced.
    value: ${{ steps.check.outputs.verdict }}

  exit-code:
    description: >-
      The process exit code from `clearance check`: 0 ok, 1 DO NOT SHIP,
      2 config error, 3 corpus error, 4 internal error, 5 UNDETERMINED with
      --strict. The five codes are a frozen contract.
    value: ${{ steps.check.outputs.exit-code }}

  sarif-file:
    description: >-
      The workspace-relative path of the SARIF file, for handing to
      github/codeql-action/upload-sarif. Empty unless the "sarif" input is
      "true" and the file was actually written.
    value: ${{ steps.sarif.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Download and verify the Clearance binary
      id: install
      shell: bash
      env:
        CLEARANCE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        version="${CLEARANCE_VERSION}"

        # ── platform ────────────────────────────────────────────────────────
        case "$(uname -s)" in
          Linux)                goos=linux ;;
          Darwin)               goos=darwin ;;
          MINGW*|MSYS*|CYGWIN*) goos=windows ;;
          *) echo "::error::Clearance: unsupported OS '$(uname -s)'"; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)   goarch=amd64 ;;
          arm64|aarch64)  goarch=arm64 ;;
          *) echo "::error::Clearance: unsupported architecture '$(uname -m)'"; exit 1 ;;
        esac

        case "$goos" in
          windows) ext=zip ;;
          *)       ext=tar.gz ;;
        esac

        # ── resolve the release tag ─────────────────────────────────────────
        if [ "$version" = "latest" ]; then
          tag="$(curl -fsSL https://api.github.com/repos/K1ngBronxo/Clearance-dev/releases/latest \
            | grep -o '"tag_name"[[:space:]]*:[[:space:]]*"[^"]*"' \
            | head -n1 \
            | sed 's/.*"\([^"]*\)"$/\1/')"
          if [ -z "$tag" ]; then
            echo "::error::Clearance: could not resolve the latest release tag"
            exit 1
          fi
        else
          tag="v${version#v}"
        fi
        ver="${tag#v}"

        # The archive name embeds the version without the leading "v", matching
        # the .goreleaser.yml name_template: clearance_{version}_{os}_{arch}.
        asset="clearance_${ver}_${goos}_${goarch}"
        base="https://github.com/K1ngBronxo/Clearance-dev/releases/download/${tag}"

        # ── download ────────────────────────────────────────────────────────
        dl="${RUNNER_TEMP:-/tmp}/clearance-dl"
        rm -rf "$dl"; mkdir -p "$dl"
        echo "Downloading ${asset}.${ext} from ${base}"
        curl -fsSL -o "$dl/${asset}.${ext}" "${base}/${asset}.${ext}"
        curl -fsSL -o "$dl/checksums.txt"   "${base}/checksums.txt"

        # ── verify BEFORE extracting or running ─────────────────────────────
        # The archive is checked against the release's checksums.txt. That is an
        # integrity check, not provenance: the published releases carry no
        # cosign signature today, so there is no signed list to check against
        # yet. When one exists, the cosign verify-blob command for it goes in
        # SECURITY.md, and this step gains nothing to do — the caller adds it.
        cd "$dl"
        if ! grep -F "${asset}.${ext}" checksums.txt > expected.txt; then
          echo "::error::Clearance: ${asset}.${ext} is not listed in checksums.txt"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c expected.txt
        else
          shasum -a 256 -c expected.txt
        fi

        # ── extract and expose on PATH ──────────────────────────────────────
        if [ "$ext" = "zip" ]; then
          if command -v unzip >/dev/null 2>&1; then
            unzip -q "${asset}.zip"
          else
            tar -xf "${asset}.zip"   # bsdtar handles zip on the Windows runner
          fi
        else
          tar -xzf "${asset}.tar.gz"
        fi

        bin="$dl/bin"; mkdir -p "$bin"
        if [ -f "clearance.exe" ]; then
          cp clearance.exe "$bin/"
        else
          cp clearance "$bin/"
        fi
        chmod +x "$bin"/clearance "$bin"/clearance.exe 2>/dev/null || true
        echo "$bin" >> "$GITHUB_PATH"

    - name: Run clearance check
      id: check
      shell: bash
      env:
        CLEARANCE_PATH: ${{ inputs.path }}
        CLEARANCE_STRICT: ${{ inputs.strict }}
        CLEARANCE_ARGS: ${{ inputs.args }}
      run: |
        # No `set -e`: the whole point is to READ the exit code, so a non-zero
        # exit from the binary must not abort the step before we classify it.
        set -uo pipefail

        strict_flag=""
        if [ "${CLEARANCE_STRICT}" = "true" ]; then
          strict_flag="--strict"
        fi

        out="${RUNNER_TEMP:-/tmp}/clearance-verdict.json"

        # --format json so the verdict class can be read without a JSON tool;
        # --output so the machine-readable result is kept for later steps.
        # shellcheck disable=SC2086
        clearance check "${CLEARANCE_PATH}" \
          --format json --output "$out" ${strict_flag} ${CLEARANCE_ARGS}
        code=$?

        verdict=""
        if [ -f "$out" ]; then
          verdict="$(grep -o '"verdict"[[:space:]]*:[[:space:]]*"[^"]*"' "$out" \
            | head -n1 | sed 's/.*"\([^"]*\)"$/\1/' || true)"
        fi
        echo "Clearance verdict: ${verdict:-<none>} (exit ${code})"

        {
          echo "verdict=${verdict}"
          echo "exit-code=${code}"
        } >> "$GITHUB_OUTPUT"

        # ── decide whether the job fails ────────────────────────────────────
        case "$code" in
          0)
            exit 0
            ;;
          5)
            # UNDETERMINED with --strict. Without --strict the binary cannot
            # exit 5, so this branch only fails when strict was requested.
            if [ "${CLEARANCE_STRICT}" = "true" ]; then
              echo "::error::Clearance: UNDETERMINED (--strict). Resolve the unknowns or drop strict."
              exit 5
            fi
            exit 0
            ;;
          1)
            echo "::error::Clearance: DO NOT SHIP - a HIGH-confidence blocking obligation was found."
            exit 1
            ;;
          2)
            echo "::error::Clearance: configuration error - fix clearance.config.yml, not your code."
            exit 2
            ;;
          3)
            echo "::error::Clearance: corpus error - missing, unsigned, tampered, or unsupported corpus."
            exit 3
            ;;
          4)
            echo "::error::Clearance: internal error - this is a Clearance bug; please report it."
            exit 4
            ;;
          *)
            echo "::error::Clearance: unexpected exit code ${code}."
            exit "$code"
            ;;
        esac

    # ── code scanning ───────────────────────────────────────────────────────
    # Runs after the verdict has already been reported and the job's outcome
    # already decided, so a problem here cannot change the verdict. It is
    # `continue-on-error` for that reason and no other: the verdict is the
    # contract, and the SARIF file is an artefact. A failure says so out loud
    # rather than pretending the file exists.
    - name: Write SARIF for code scanning
      id: sarif
      # `always()` is load-bearing. The step above fails the job on a DO NOT
      # SHIP verdict, and a failed step skips every step after it - so without
      # this, the run most worth seeing in the Security tab is the one that
      # never writes a SARIF file.
      if: ${{ inputs.sarif == 'true' && always() }}
      shell: bash
      continue-on-error: true
      env:
        CLEARANCE_PATH: ${{ inputs.path }}
        CLEARANCE_STRICT: ${{ inputs.strict }}
        CLEARANCE_ARGS: ${{ inputs.args }}
        CLEARANCE_SARIF: ${{ inputs.sarif-file }}
        CLEARANCE_WORKSPACE: ${{ github.workspace }}
      run: |
        set -uo pipefail

        strict_flag=""
        if [ "${CLEARANCE_STRICT}" = "true" ]; then
          strict_flag="--strict"
        fi

        # A second scan of the same tree by the same binary. The findings are
        # identical to the ones the verdict was folded from; only the envelope
        # differs. Running the binary twice rather than converting its JSON is
        # the whole point: the Security tab then shows what the binary said,
        # and no bespoke mapping between the two can drift or disagree.
        out="${CLEARANCE_WORKSPACE}/${CLEARANCE_SARIF}"
        # shellcheck disable=SC2086
        clearance check "${CLEARANCE_PATH}" \
          --format sarif --output "$out" ${strict_flag} ${CLEARANCE_ARGS}
        code=$?

        if [ ! -s "$out" ]; then
          echo "::warning::Clearance: no SARIF file was written to ${CLEARANCE_SARIF} (exit ${code}). Code scanning will have nothing to upload."
          exit 0
        fi

        echo "sarif-file=${CLEARANCE_SARIF}" >> "$GITHUB_OUTPUT"
        results="$(grep -c '"ruleId"' "$out" || true)"
        echo "Wrote ${results} SARIF result(s) to ${CLEARANCE_SARIF}"
