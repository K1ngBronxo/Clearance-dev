    severity: CONDITION
  - dependency: npm:gnu-thing@2.0.0
    kind: gpl-3.0.convey-verbatim
    severity: CONDITION
  - dependency: npm:gnu-thing@2.0.0
    kind: gpl-3.0.installation-information
    severity: NOTE
  - dependency: npm:gnu-thing@2.0.0
