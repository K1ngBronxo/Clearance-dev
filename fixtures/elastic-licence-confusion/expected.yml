# The verdict this fixture must produce.
#
# Asserted by TestFixtures in internal/guard_corpus_test.go. See expected.yml in
# npm-agpl-saas/ for why these are claims rather than recorded snapshots.
#
# `severity` below is the EFFECTIVE severity. elastic-2.0.managed-service is
# declared BLOCK and lands as CONDITION.
verdict: SHIP_CONDITIONAL

why: >
  Elastic moved its products from Apache-2.0 to the Elastic License 2.0 and
  later to the AGPL. The historical Apache-2.0 grant is the one everyone
  remembers, which is what makes "it is on GitHub" a dangerous reading: the
  version you are pulling today may not carry the licence you think it does.

  # THE PAIR THIS FIXTURE EXISTS TO SEPARATE

  sspl-not-open-source and elastic-licence-confusion are the same shape — a
  source-available licence mistaken for an open-source one — and they used to
  be indistinguishable to the engine, because both were keyed on
  `family == source-available`. Any dependency under either licence fired both
  traps, so an SSPL dependency produced a finding citing Elastic's blog and an
  Elastic dependency produced one citing MongoDB's FAQ.

  A citation that points at the wrong licence is worse than no finding. It is
  the part of the output a reader is least able to check and most likely to
  forward to someone else, and it is wrong in a way that looks authoritative.

  Both traps now name their licence: this one on `dep.licence.spdx ==
  Elastic-2.0`, the SSPL one on `SSPL-1.0`, and trap.busl.conversion on
  `BUSL-1.1`. The three fixtures together are the regression test for that.

  # WHY THE TRAP IS A CONDITION WHILE ITS NEIGHBOUR IS A BLOCK

  Compare the effective severities with sspl-not-open-source, where both the
  obligation and the trap are declared BLOCK. Here the corpus rates the trap
  CONDITION and the obligation BLOCK, so after the MEDIUM-confidence gate both
  land as CONDITION anyway — but for different reasons, and the reasons matter.

  The SSPL trap says the licence is not OSI-approved, which is a statement
  about the licence's status and is equally true of every use. The Elastic trap
  says the historical grant may no longer apply, which is a warning about a
  *version* — check which licence the exact version carries. A warning about
  which version you have is a caution, not a prohibition.

  # THE OBLIGATION BESIDE IT

  elastic-2.0.managed-service is the obligation layer: the licence forbids
  providing the software to third parties as a hosted or managed service, which
  is the prohibited use this project is in (`saas: true`). It is declared BLOCK
  at MEDIUM confidence, so it renders as a CONDITION with the clause text
  shown — a curated summary of a licence page is not the same kind of evidence
  as a licence file, and INV-2 does not let it forbid. elastic-2.0.not-open-source
  is the status NOTE, the counterpart of sspl-1.0.not-open-source.

findings:
  - dependency: npm:elastic-thing@1.0.0
    kind: elastic-2.0.managed-service
    severity: CONDITION
  - dependency: npm:elastic-thing@1.0.0
    kind: trap.elastic.licence-confusion
    severity: CONDITION
  - dependency: npm:elastic-thing@1.0.0
    kind: elastic-2.0.not-open-source
    severity: NOTE

undetermined: []
warnings: []
notices: []
