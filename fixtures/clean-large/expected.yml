# Asserted by TestFixtures in internal/guard_corpus_test.go.

verdict: SHIP

why: >
        500 permissive dependencies in one manifest and one lockfile. This is the
        catalogue's performance row: the claim under test is that volume alone does
        not change the verdict, and the warning that volume is what turns a scanner
        into a liability.

        Every fourth dependency is Apache-2.0 and therefore earns the patent-grant
        NOTE; the other three quarters are MIT, ISC and BSD-3-Clause and earn
        nothing. That gives exactly 125 findings for 500 dependencies - the fixture
        records the per-dependency rate, so a change that starts emitting a note per
        dependency, or that drops the Apache-2.0 grant, changes 125 to something
        else and this row says so.

        The verdict is SHIP. A tool that returned CONDITION or UNDETERMINED because
        the tree was large would be hallucinating a legal fact out of a file count.

