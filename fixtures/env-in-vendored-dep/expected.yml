verdict: SHIP

why: >
        A vendored dependency that ships a `.env` containing two sentinel values:
        `DATABASE_URL` with an embedded password and `API_KEY`, both set to
        `SENTINEL_NOT_A_REAL_SECRET_*` so that any leak is unambiguous and harmless.
        The dependency's licence is MIT and resolves.

        Observed: SHIP, and **nothing else** - 0 findings, 0 unclassified, 0
        warnings, 0 notices.

        # THE HALF OF THIS ROW THAT HOLDS, AND THE HALF THAT DOES NOT

        The catalogue's section 7 expects "existence reported, contents never in
        output". Verified against the real run:

          - **Contents never in output: TRUE, and asserted here.** Grepping the full
            CLI output for `env`, `secret` and `SENTINEL` returns only the verdict
            header line. Neither the file's name nor either value appears anywhere in
            the report.
          - **Existence reported: FALSE.** Nothing reports that a `.env` exists. The
            extension switch in `internal/scanner/upstream.go:245` returns `langNone`
            for `case ".env"` with the comment "`.env` is a secrets file. Not read."
            - so the file is neither read nor recorded, and no counter, notice or
            finding mentions it.

        # AND THE CODE THAT WAS DECLARED FOR IT HAS NO PRODUCER

        The taxonomy declares `E-SCAN-017` for exactly this case
        (`internal/cerr/code.go:82,307`), DEGRADE class, with the message "A
        vendored dependency contains a .env file. Clearance records its existence
        only; contents are never read." and the remediation "Check it does not
        contain real secrets". Nothing in the tree emits it. Auditing that led to
        a full pass over the taxonomy: 21 of 102 declared codes are produced
        nowhere, and `E-SCAN-017` is one of three that sit on the guard's
        `degradeCodesAwaitingAFixture` list, which asserts every entry is
        provokable by a directory of files. None of the three can be provoked,
        because no code emits them. Noted here rather than asserted, 2026-09-26.

        So this row pins three separate facts at once: the file is not read, it
        is not reported, and the code named for reporting it is dead. The second
        half of the catalogue's claim is not merely unimplemented - it was
        specified, documented and never wired.

        The safety property is intact and is the one that matters: the tool cannot
        leak what it never reads. What is weaker than the catalogue claims is
        observability - a user is not told that their tree contains a secrets file at
        all, so this row asserts silence and the `why` records the gap rather than
        inventing a notice to satisfy the table.

        `.env.example` and its siblings are the deliberate exception
        (`upstream.go:256`): read for key NAMES only, never values.

